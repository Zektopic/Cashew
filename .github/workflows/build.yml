name: Build Binaries

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      # flutter clean before pub get: the generated plugin registrants under
      # .dart_tool/flutter_build are not invalidated when a plugin changes its
      # layout. file_picker 12 moved web support into a separate package, and a
      # stale registrant still importing file_picker/_internal/file_picker_web
      # fails the web build. Cheap insurance on a cached runner.
      - name: Install dependencies
        run: cd budget && flutter clean && flutter pub get

      # Gate on errors only: pre-existing warnings/infos are tracked but must
      # not block builds. Compile errors (e.g. duplicate fields from a bad
      # merge) fail this job.
      - name: Analyze
        run: cd budget && flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: cd budget && flutter test

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      # flutter clean before pub get: the generated plugin registrants under
      # .dart_tool/flutter_build are not invalidated when a plugin changes its
      # layout. file_picker 12 moved web support into a separate package, and a
      # stale registrant still importing file_picker/_internal/file_picker_web
      # fails the web build. Cheap insurance on a cached runner.
      - name: Install dependencies
        run: cd budget && flutter clean && flutter pub get

      # google-services.json is not committed. Use the repo secret if
      # configured, otherwise fall back to the placeholder so debug builds
      # still compile.
      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > budget/android/app/google-services.json
          else
            cp budget/android/app/google-services.json.example budget/android/app/google-services.json
          fi

      - name: Build APK
        run: cd budget && flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cashew-apk
          path: budget/build/app/outputs/flutter-apk/app-debug.apk

  # iOS had no CI coverage at all, so nothing verified the platform config.
  # It matters now for two reasons: file_picker 12 raised the minimum iOS
  # deployment target to 14.0 (changed in ios/Podfile and the Xcode project),
  # and sqlite3 3.x bundles SQLite through Dart build hooks instead of the
  # retired sqlite3_flutter_libs. Both are iOS-native concerns that only a
  # macOS runner can exercise. --no-codesign keeps this working without any
  # signing secrets.
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: analyze-and-test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: cd budget && flutter clean && flutter pub get

      - name: Verify iOS deployment target is at least 14.0
        run: |
          cd budget
          grep -q "platform :ios, '14.0'" ios/Podfile
          ! grep -E "IPHONEOS_DEPLOYMENT_TARGET = 1[0-3]\." ios/Runner.xcodeproj/project.pbxproj
          echo "iOS deployment target OK"

      - name: Build iOS (no codesign)
        run: cd budget && flutter build ios --debug --no-codesign

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    # NOT continue-on-error. Desktop used to get SQLite from
    # sqlite3_flutter_libs; since that package was retired, sqlite3 3.x bundles
    # it through Dart build hooks. A hook failure here must fail the build
    # rather than be swallowed.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      # flutter clean before pub get: the generated plugin registrants under
      # .dart_tool/flutter_build are not invalidated when a plugin changes its
      # layout. file_picker 12 moved web support into a separate package, and a
      # stale registrant still importing file_picker/_internal/file_picker_web
      # fails the web build. Cheap insurance on a cached runner.
      - name: Install dependencies
        run: cd budget && flutter clean && flutter pub get

      - name: Build Linux
        run: cd budget && flutter build linux --release

      - name: Archive Linux build
        run: tar -czf cashew-linux.tar.gz -C budget/build/linux/x64/release/bundle .

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: cashew-linux
          path: cashew-linux.tar.gz

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    # NOT continue-on-error -- see build-linux. This is also the only place the
    # Windows build is exercised at all; it cannot run on a dev machine without
    # Developer Mode enabled for symlink support.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      # flutter clean before pub get: the generated plugin registrants under
      # .dart_tool/flutter_build are not invalidated when a plugin changes its
      # layout. file_picker 12 moved web support into a separate package, and a
      # stale registrant still importing file_picker/_internal/file_picker_web
      # fails the web build. Cheap insurance on a cached runner.
      - name: Install dependencies
        run: cd budget && flutter clean && flutter pub get

      - name: Build Windows
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: cd budget && flutter build windows --release

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: cashew-windows
          path: budget/build/windows/x64/runner/Release/
